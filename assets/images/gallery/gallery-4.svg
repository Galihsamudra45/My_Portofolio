<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="url(#g4)" rx="8" />

  <!-- Sun in sky -->
  <circle cx="420" cy="80" r="40" fill="#fef08a" opacity="0.6" />

  <!-- Green Grass / Outdoor Field -->
  <path d="M 0 240 Q 250 200 500 240 L 500 350 L 0 350 Z" fill="#15803d" />

  <!-- Volunteer Banner -->
  <rect x="100" y="50" width="300" height="60" rx="8" fill="#ffffff" />
  <text x="250" y="80" font-family="'Plus Jakarta Sans', Arial" font-size="16" font-weight="bold" fill="#c2410c" text-anchor="middle">PROGRAM RELAWAN DIGITAL</text>
  <text x="250" y="98" font-family="'Plus Jakarta Sans', Arial" font-size="11" fill="#64748b" text-anchor="middle">Edukasi Literasi Teknologi Desa Binaan</text>

  <!-- Team of volunteers standing hand in shoulder -->
  <!-- Person 1 -->
  <circle cx="150" cy="180" r="16" fill="#fed7aa" />
  <path d="M 130 240 C 130 205 170 205 170 240 Z" fill="#ffffff" />

  <!-- Person 2 -->
  <circle cx="200" cy="175" r="16" fill="#fcd34d" />
  <path d="M 180 240 C 180 200 220 200 220 240 Z" fill="#ffffff" />

  <!-- Person 3 (Center) -->
  <circle cx="250" cy="170" r="17" fill="#fed7aa" />
  <path d="M 230 240 C 230 195 270 195 270 240 Z" fill="#2563eb" />

  <!-- Person 4 -->
  <circle cx="300" cy="175" r="16" fill="#fed7aa" />
  <path d="M 280 240 C 280 200 320 200 320 240 Z" fill="#ffffff" />

  <!-- Person 5 -->
  <circle cx="350" cy="180" r="16" fill="#fdba74" />
  <path d="M 330 240 C 330 205 370 205 370 240 Z" fill="#ffffff" />
</svg>

