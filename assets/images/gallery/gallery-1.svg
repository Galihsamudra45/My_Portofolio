<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="stageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="url(#g1)" rx="8" />

  <!-- Stage Screen Background -->
  <rect x="50" y="30" width="400" height="180" rx="8" fill="url(#stageGrad)" />
  <text x="250" y="100" font-family="'Plus Jakarta Sans', Arial" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">SEMINAR TEKNOLOGI NASIONAL</text>
  <text x="250" y="130" font-family="'Plus Jakarta Sans', Arial" font-size="13" fill="#bfdbfe" text-anchor="middle">"Accelerating Digital Transformation in Industry 5.0"</text>
  
  <!-- Stage Lights -->
  <polygon points="50,30 120,240 180,240" fill="#ffffff" opacity="0.12" />
  <polygon points="450,30 380,240 320,240" fill="#ffffff" opacity="0.12" />

  <!-- Podium / Speaker -->
  <rect x="230" y="210" width="40" height="70" fill="#334155" rx="4" />
  <!-- Speaker Figure -->
  <circle cx="250" cy="180" r="14" fill="#fed7aa" />
  <path d="M 235 210 C 235 198 265 198 265 210 Z" fill="#2563eb" />

  <!-- Audience Heads (Silhouette) -->
  <g fill="#020617">
    <ellipse cx="70" cy="310" rx="28" ry="32" />
    <ellipse cx="140" cy="295" rx="26" ry="32" />
    <ellipse cx="205" cy="305" rx="28" ry="32" />
    <ellipse cx="295" cy="305" rx="28" ry="32" />
    <ellipse cx="360" cy="295" rx="26" ry="32" />
    <ellipse cx="430" cy="310" rx="28" ry="32" />
  </g>
</svg>

