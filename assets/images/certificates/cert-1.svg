  <text x="300" y="268" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" text-anchor="middle" fill="#64748b">Meliputi HTML5 Semantics, Responsive CSS Grid/Flexbox, JavaScript ES6+, dan Web Accessibility (A11y)</text>

