      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Certificate Border -->
  <rect width="600" height="420" fill="#fdfbf7" stroke="#e2e8f0" stroke-width="4" rx="8" />
  <rect x="15" y="15" width="570" height="390" fill="none" stroke="#2563eb" stroke-width="2" rx="4" />
  <rect x="22" y="22" width="556" height="376" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Badge Emblem Top -->
