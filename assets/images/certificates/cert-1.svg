  <polygon points="300,55 306,66 318,66 308,74 312,85 300,78 288,85 292,74 282,66 294,66" fill="#ffffff" />

  <text x="300" y="125" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#1e293b" letter-spacing="1.5">SERTIFIKAT KELULUSAN</text>
  <text x="300" y="145" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">Diberikan secara terhormat kepada:</text>

